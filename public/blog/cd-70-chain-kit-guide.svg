<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source of cd-70-chain-kit-guide.png (the demo post's cover). Text uses textLength so it fits with any font. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f66"/>
      <stop offset="0.6" stop-color="#153eb0"/>
      <stop offset="1" stop-color="#1d4fd8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.76" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b6cf5" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3b6cf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4c8"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1130" cy="80" r="160" fill="#e11d2e" fill-opacity="0.12"/>

  <g filter="url(#shadow)">
    <!-- chain: runs on the teeth of both sprockets -->
    <path id="chain" d="M860 196 L1062 250 A80 80 0 0 1 1062 410 L860 464 A134 134 0 0 1 860 196 Z" fill="none" stroke="#071447" stroke-width="30" stroke-linejoin="round"/>
    <path d="M860 196 L1062 250 A80 80 0 0 1 1062 410 L860 464 A134 134 0 0 1 860 196 Z" fill="none" stroke="url(#steel)" stroke-width="20" stroke-dasharray="18 8" stroke-linejoin="round"/>
    <path d="M860 196 L1062 250 A80 80 0 0 1 1062 410 L860 464 A134 134 0 0 1 860 196 Z" fill="none" stroke="#071447" stroke-width="5" stroke-dasharray="18 8" stroke-dashoffset="-4" stroke-opacity="0.5"/>

    <!-- rear sprocket -->
    <g transform="translate(860 330)">
      <circle r="114" fill="none" stroke="#dbe4f0" stroke-width="20" stroke-dasharray="14 9.8"/>
      <circle r="104" fill="url(#steel)"/>
      <circle r="80" fill="#c3cfdd"/>
      <g fill="#0a1f66" fill-opacity="0.85">
        <circle cx="0" cy="-50" r="17"/><circle cx="43" cy="-25" r="17"/><circle cx="43" cy="25" r="17"/>
        <circle cx="0" cy="50" r="17"/><circle cx="-43" cy="25" r="17"/><circle cx="-43" cy="-25" r="17"/>
      </g>
      <circle r="26" fill="#e11d2e"/>
      <circle r="10" fill="#0a1f66"/>
    </g>

    <!-- front sprocket -->
    <g transform="translate(1062 330)">
      <circle r="62" fill="none" stroke="#dbe4f0" stroke-width="18" stroke-dasharray="11 7.5"/>
      <circle r="52" fill="url(#steel)"/>
      <circle r="36" fill="#c3cfdd"/>
      <circle r="17" fill="#e11d2e"/>
      <circle r="7" fill="#0a1f66"/>
    </g>
  </g>

  <!-- text (fixed widths, so any font fits) -->
  <g font-family="'Barlow Condensed','Arial Narrow','Roboto Condensed',Arial,sans-serif" font-weight="800">
    <rect x="72" y="96" width="236" height="40" rx="20" fill="#e11d2e"/>
    <text x="96" y="124" fill="#fff" font-size="21" textLength="188" lengthAdjust="spacingAndGlyphs">MAINTENANCE TIPS</text>
    <text x="68" y="236" fill="#fff" font-size="104" textLength="262" lengthAdjust="spacingAndGlyphs">CD 70</text>
    <text x="68" y="338" fill="#fff" font-size="104" textLength="560" lengthAdjust="spacingAndGlyphs">CHAIN KIT</text>
    <text x="72" y="398" fill="#9dbbff" font-size="34" textLength="560" lengthAdjust="spacingAndGlyphs">7 SIGNS IT'S TIME TO REPLACE</text>
    <text x="72" y="442" fill="#9dbbff" font-size="34" textLength="560" lengthAdjust="spacingAndGlyphs">+ HOW TO CHOOSE THE RIGHT ONE</text>
  </g>
  <g font-family="'Manrope',Segoe UI,Arial,sans-serif" font-weight="700">
    <rect x="72" y="498" width="268" height="56" rx="28" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="104" cy="526" r="15" fill="#e11d2e"/>
    <text x="104" y="532" fill="#fff" font-size="16" text-anchor="middle">B</text>
    <text x="130" y="533" fill="#fff" font-size="20">Al Bashir Autos</text>
  </g>
</svg>
